workflows:
  ios-workflow:
    name: iOS Build
    instance_type: mac_mini_m1
    environment:
      node: latest
      xcode: latest
    scripts:
      - name: Install Ionic & Capacitor CLI
        script: npm install -g @ionic/cli @capacitor/cli
      - name: Install Dependencies
        script: npm install
      - name: Add & Sync iOS
        script: |
          npx cap add ios || true
          npx cap sync ios
      - name: Build iOS Project
        script: |
          cd ios/App
          xcodebuild build -workspace App.xcworkspace -scheme App -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO
